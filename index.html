<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>RAYSPORT Rim Catalogue</title>

  <!-- APP VERSION: 1054 -->

  <link rel="stylesheet" href="style.css?v=1054">

  <link rel="manifest" href="manifest.json?v=1054">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1054">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1054">
  <meta name="theme-color" content="#111111">
</head>

<body>

  <div id="loginScreen" class="loginScreen">
    <div class="loginBox">
      <h2>Login</h2>
      <p>Enter customer name and sales person WhatsApp number</p>

      <input type="text" id="loginName" placeholder="Customer Name">
      <input type="tel" id="loginPhone" placeholder="Sales Person WhatsApp. Example: 60123456789">

      <button id="loginButton">Continue</button>
      <small id="loginError"></small>
    </div>
  </div>

  <header>
    <div class="topHeaderRow">
      <img src="logo.png?v=1006" class="headerLogo" alt="RAYSPORT">
      <button id="refreshAppButton" title="Refresh App">Refresh</button>
    </div>

    <div class="searchWrap">
      <input type="text" id="search" placeholder="Search rim...">
      <button id="clearSearchButton" type="button">X</button>
    </div>

    <div class="headerActionRow">
      <button id="logoutButton">Logout</button>

      <div class="pcdMenu">
        <button onclick="showCategory('4X100')">4X100</button>
        <button onclick="showCategory('4X108')">4X108</button>
        <button onclick="showCategory('4X114.3')">4X114.3</button>
        <button onclick="showCategory('8X100/110')">8X100/110</button>
        <button onclick="showCategory('8X100/114.3')">8X100/114.3</button>
        <button onclick="showCategory('5X100')">5X100</button>
        <button onclick="showCategory('5X108')">5X108</button>
        <button onclick="showCategory('5X112')">5X112</button>
        <button onclick="showCategory('5X113.1')">5X113.1</button>
        <button onclick="showCategory('5X114.3')">5X114.3</button>
        <button onclick="showCategory('5X120')">5X120</button>
        <button onclick="showCategory('6X114.3')">6X114.3</button>
        <button onclick="showCategory('6X139.7')">6X139.7</button>
        <button onclick="showCategory('10X100/114.3')">10X100/114.3</button>
        <button onclick="showCategory('12X135/139.7')">12X135/139.7</button>
      </div>
    </div>

    <div class="categoryMenu">
      <button onclick="showCategory('ALL')">ALL</button>
      <button onclick="showCategory('14')">14</button>
      <button onclick="showCategory('15X6.5')">15X6.5</button>
      <button onclick="showCategory('15X7.0')">15X7 / 7.5 / 8</button>
      <button onclick="showCategory('16X')">16X</button>
      <button onclick="showCategory('17X')">17X</button>
      <button onclick="showCategory('18X')">18X</button>
      <button onclick="showCategory('19X')">19X</button>
      <button onclick="showCategory('20X')">20X</button>
      <button onclick="showCategory('4X4')">4X4</button>
      <button onclick="showCategory('NEW ARRIVAL')">NEW ARRIVAL</button>
      <button onclick="showCategory('FORGED')">FORGED</button>
    </div>

    <button id="cartButton">
      Cart (<span id="cartCount">0</span>)
    </button>
  </header>

  <div id="productGrid" class="grid"></div>

  <div id="cartPanel" class="hidden">
    <div class="cartHeader">
      <h2>Your Cart</h2>
      <button id="closeCart">X</button>
    </div>

    <button id="branchSettingButton" type="button">Branch Setting</button>
    <div id="branchSettingPanel" class="branchSettingPanel hidden"></div>

    <div id="cartItems"></div>
    <button id="sendWhatsapp">Send To WhatsApp</button>
  </div>

  <div id="photoViewer" class="hidden photoViewer">
    <div class="photoViewerBox">
      <button class="closeViewer" onclick="closePhotoViewer()">X</button>

      <h3 id="viewerTitle">Front View</h3>
      <img id="viewerImage" src="">

      <div class="viewerButtons">
        <button onclick="prevPhoto()">Previous</button>
        <button onclick="nextPhoto()">Next</button>
      </div>
    </div>
  </div>


  <div id="logoutConfirmModal" class="hidden logoutConfirmOverlay">
    <div class="logoutConfirmBox">
      <h3>Confirm Logout / &#30830;&#35748;&#30331;&#20986;</h3>
      <p>Are you sure you want to log out? All current data, branch settings, and cart information will be reset.</p>
      <p>&#24744;&#30830;&#23450;&#35201;&#30331;&#20986;&#21527;&#65311;&#24403;&#21069;&#36164;&#26009;&#12289;&#20998;&#34892;&#35774;&#32622;&#21644;&#36141;&#29289;&#36710;&#20869;&#23481;&#23558;&#20250;&#34987;&#37325;&#32622;&#12290;</p>

      <div class="logoutConfirmActions">
        <button id="cancelLogoutButton" type="button">Cancel / &#21462;&#28040;</button>
        <button id="confirmLogoutButton" type="button">Logout / &#30331;&#20986;</button>
      </div>
    </div>
  </div>
  <script src="script.js?v=1054"></script>

</body>
</html>
